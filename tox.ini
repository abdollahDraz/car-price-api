
[pytest]
log_cli_level = WARNING
markers =
    differential: compare current model predictions with the saved baseline

[tox]
min_version = 4
envlist = test_app, checks
skipsdist = True

[testenv]
install_command = pip install {opts} {packages}

[testenv:test_app]
deps =
    -r test_requirements.txt

setenv =
    PYTHONPATH = {toxinidir}
    PYTHONHASHSEED = 0

commands =
    pytest -vv {posargs:app/tests/}

[testenv:run]
envdir = {toxworkdir}/test_app
deps =
    {[testenv:test_app]deps}

setenv =
    {[testenv:test_app]setenv}

commands =
    python app/main.py

[testenv:checks]
envdir = {toxworkdir}/checks

deps =
    -r typing_requirements.txt

commands =
    python -m flake8 app
    python -m isort app
    python -m black app



[flake8]
exclude = .git,__pycache__,__init__.py,.mypy_cache,.pytest_cache,.venv,venv,alembic
max-line-length = 88
