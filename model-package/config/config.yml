# Application configuration
package_name: "car_price_model"
dataset_name: "used_cars.csv"
new_dataset_name: "new_cars.csv"
incoming_dataset_dir: "incoming"
target: "price"
preprocessing_pipeline_name: "Preprocessing_train_Pipline.pkl"
target_pipeline_name: "Target_Pipeline.pkl"


# name of variables 
variables:
  mileage: ["milage"]
  engine: ["engine"]
  car_age: ["model_year"]
  transmission: ["transmission"]
  color: ["ext_col", "int_col"]
  price: ["price"]
  accident: ["accident"]
  fuel_type: ["fuel_type"]
  clean_title: ["clean_title"]





# Model configuration
features:
  - "brand"
  - "model"
  - "car_age"
  - "milage"
  - "fuel_type"
  - "horsepower"
  - "engine_size"
  - "cylinder_count"
  - "transmission_type"
  - "ext_col_group"
  - "int_col_group"
  - "accident"
  - "clean_title"

numerical_vars:
  - "milage"
  - "horsepower"
  - "engine_size"
  - "cylinder_count"
  - "car_age"

categorical_vars:
  - "brand"
  - "model"
  - "fuel_type"
  - "transmission_type"
  - "ext_col_group"
  - "int_col_group"

binary_vars:
  - "accident"
  - "clean_title"


n_estimators: 300
random_state: 42
n_jobs: -1
min_frequency: 10
test_size: 0.2
