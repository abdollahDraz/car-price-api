
[tox]
min_version = 4
envlist = test_package, checks
skipsdist = True

[testenv]
base_python = python
setenv =
    PYTHONPATH = {toxinidir}
    PYTHONHASHSEED = 0

[testenv:test_package]
deps =
    -r requirements-test.txt
commands =
    pytest -s -vv {posargs:tests/}

[testenv:train]
deps =
    -r requirements-test.txt
commands =
    python train.py

[testenv:checks]
deps =
    -r requirements.txt
    flake8
    isort
commands =
    flake8 processing config car_price_model tests
    isort --check-only processing config car_price_model tests
